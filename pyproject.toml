[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "docueditor"
version = "0.4.0"
description = "A WYSIWYG desktop editor for Docusaurus documentation, with Novelwriter and Yuque importers."
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name = "avis-illusio" }]
keywords = ["docusaurus", "markdown", "mdx", "editor", "pyside6", "qt", "wysiwyg"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Documentation",
    "Topic :: Text Editors",
]
dependencies = ["PySide6>=6.5"]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
docueditor = "docueditor.app:main"

[project.urls]
Homepage = "https://github.com/avis-illusio/docueditor"
Issues = "https://github.com/avis-illusio/docueditor/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
docueditor = ["resources/*.qss"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
